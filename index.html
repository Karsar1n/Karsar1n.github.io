<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тетрис</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="screen-start" class="screen active">
        <div class="menu-card">
            <h1 class="logo">ТЕТРИС</h1>
            <button class="btn" id="btn-start-game">Старт игры</button>
            <button class="btn" id="btn-open-settings">Настройки</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div class="game-container">
            <div class="triangle-wrapper">
                <div class="tetris-triangle-grid" id="tetris-board"></div>
            </div>
            <div class="side-panel">
                <div>
                    <div class="info-box">
                        <h3>СЧЕТ</h3>
                        <span id="score-display">0</span>
                    </div>
                    <div class="info-box">
                        <h3>СЛЕДУЮЩАЯ</h3>
                        <div class="next-grid" id="next-piece-grid"></div>
                    </div>
                </div>
                <div class="touch-controls">
                    <button class="btn-touch" id="btn-left">◀</button>
                    <button class="btn-touch" id="btn-rotate">↻</button>
                    <button class="btn-touch" id="btn-right">▶</button>
                    <button class="btn-touch btn-down" id="btn-down">▼</button>
                </div>

                <button class="btn-small" id="btn-exit-game">Выйти</button>
            </div>
        </div>
    </div>

    <div id="screen-settings" class="screen">
        <div class="settings-card">
            <h2>Настройки</h2>
            <div class="setting-group">
                <label for="difficulty">Сложность (Скорость):</label>
                <select id="difficulty">
                    <option value="easy" selected>Легкая</option>
                    <option value="medium">Средняя</option>
                    <option value="hard">Высокая</option>
                </select>
            </div>
            <button class="btn-back" id="btn-settings-back">Назад в меню</button>
        </div>
    </div>

    <div id="screen-gameover" class="screen">
        <div class="modal-card">
            <h1 class="gameover-title">GAME OVER</h1>
            <div class="score-info">
                Вы набрали: <span id="final-score">0</span> очков
            </div>
            <button class="btn" id="btn-restart">Играть снова</button>
            <button class="btn" id="btn-gameover-menu">В меню</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
